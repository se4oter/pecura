    </div>
  `;

  const inner = document.getElementById("newsBlocksInner");

  function renderBlock(b) {
    if (b.type === "hero") {
    return `
        <figure style="margin:0 0 22px;">
        <img class="news-img news-img--rounded" src="${b.img}" alt="${b.caption || ''}">
        ${b.caption ? `<figcaption class="news-caption">${b.caption}</figcaption>` : ''}
        </figure>
    `;
    }

    if (b.type === "text") {
      return `
        <div style="margin: 0 0 18px; line-height:1.9; font-size:16px;">
          ${b.html}
        </div>`;
    }

    if (b.type === "gallery") {
    const cols = b.cols || 2;

    const imgs = (b.images || []).map(img =>
        `<figure class="news-gallery-item">
        <img class="news-gallery-img" 
                src="${img.src}" 
                alt="${img.caption || ''}">
        ${img.caption ? `<figcaption class="news-caption">${img.caption}</figcaption>` : ''}
        </figure>`
    ).join("");

    return `
        <div class="news-gallery cols-${cols}">
        ${imgs}
        </div>`;
    }

    if (b.type === "image-right") {
    return `
        <div style="display:grid; grid-template-columns:1.1fr .9fr; gap:18px; align-items:start; margin: 22px 0;">
        <div style="line-height:1.9; font-size:16px;">${b.html}</div>
        <figure>
            <img class="news-img news-img--rounded" src="${b.img}" alt="${b.caption || ''}">
            ${b.caption ? `<figcaption class="news-caption">${b.caption}</figcaption>` : ''}
        </figure>
        </div>
    `;
    }

    if (b.type === "quote") {
      return `
        <blockquote style="margin: 22px 0; padding: 16px 18px; background:#f5f7fa;
          border-left:4px solid #32b29e; border-radius:12px; font-size:16px;">
          ${b.text}
        </blockquote>`;
    }

    if (b.type === "links-marquee") {
    const items = (b.items || []);
    if (!items.length) return "";

    const track = items.map(it =>
        `<a class="news-marquee__item" href="${it.href}" target="_blank" rel="noopener">${it.text}</a>`
    ).join("");

    // ✅ 複製一份，做無縫循環
    return `
        <div class="news-marquee">
        <div class="news-marquee__label">媒體報導</div>
        <div class="news-marquee__viewport">
            <div class="news-marquee__track">
            ${track}
            ${track}
            </div>
        </div>
        </div>
    `;
    }

    return "";
  }

  (news.blocks || []).forEach(b => inner.insertAdjacentHTML("beforeend", renderBlock(b)));
})();
</script>
