      "html": "<p>偵脈科技入選 2026 Qualcomm Innovate in Taiwan Challenge（QITC）前十名團隊，正式進入後續育成階段。QITC 由 Qualcomm Technologies 推動，旨在發掘並培育具創新技術與市場潛力的台灣新創團隊，並透過技術資源、專業輔導與商業化支持，協助新創加速產品開發與市場布局。</p>"
    },
    {
      "type": "text",
      "html": "<p>偵脈科技以智慧型周邊循環即時監測系統參與本次評選，聚焦周邊動脈疾病（PAD）早期篩檢與長期監測需求，透過非壓脈帶式量測方式整合 PPG 與 ECG 生理訊號，降低傳統周邊循環檢測對專業操作人力、量測流程與使用場域的限制，期望將血管健康監測延伸至診所、健檢、長照與更多日常健康照護情境。</p>"
    },
    {
      "type": "text",
      "html": "<p>QITC 2026 評選著重技術創新性、實際應用價值、市場關聯性、產品設計完整度、上市時程優勢與商業發展潛力等面向；入選團隊將於育成期間獲得技術支援、專業培訓、商業策略與智慧財產相關資源，持續優化產品與市場發展方向。</p>"
    },
    {
      "type": "text",
      "html": "<p>此次入選前十名，是偵脈科技在技術產品化與商業發展歷程中的重要里程碑。透過 QITC 育成資源與產業鏈結，團隊將持續精進產品技術與應用模式，強化智慧型周邊循環監測系統於實際場域中的落地能力，並逐步拓展更多醫療與健康科技市場機會。</p>"
    }
  ]
},
    "6": {
  "title": "偵脈科技亮相 2026 亞洲生技大展，拓展心血管與健檢市場交流",
  "date": "2026 年 7 月 16 日",
  "blocks": [
    {

    {
      "type": "text",
      "html": "<p>偵脈科技於 2026 亞洲生技大展期間，於國立成功大學展區共同設展，展示團隊自主開發的智慧型周邊循環即時監測系統，向醫療與生技產業專業人士分享周邊血管健康監測的創新技術與產品應用方向。</p>"

        }
      ]
    },
    {
      "type": "text",
      "html": "<p>本次展會期間，多家心血管診所、健檢機構及相關醫療單位前來交流，並針對產品的量測流程、操作便利性與實際應用情境進一步了解。相較於傳統周邊循環檢測設備，偵脈科技以非壓脈帶式量測方式結合 PPG 與 ECG 訊號，希望降低操作門檻，並提升周邊血管健康評估在不同醫療場域中的使用彈性。</p>"

    {
      "type": "text",
      "html": "<p>從現場交流回饋中，也可觀察到心血管診所與健檢相關單位對於快速量測、簡化操作流程，以及導入日常健康檢查與風險評估的應用具有高度興趣。透過與第一線潛在使用者直接交流，團隊進一步掌握不同場域在檢測效率、人力配置及健康管理上的實際需求，作為後續產品優化與市場布局的重要參考。</p>"

    {
      "type": "text",
      "html": "<p>本次參展不僅提升偵脈科技於醫療與生技產業中的品牌曝光度，也進一步建立與潛在醫療院所、健檢機構及產業合作夥伴的連結。未來，偵脈科技將持續透過展會、醫療場域交流與產業合作，推動智慧型周邊循環監測技術朝更多實際應用情境發展，逐步擴大產品於心血管健康與預防醫學市場中的應用機會。</p>"

  ]
},
    "7": {
  "title": "偵脈科技入選 115-2 FITI 創新創業激勵計畫，持續加速技術商品化與市場布局",
  "date": "2026 年 7 月 22 日",
  "blocks": [

      "type": "text",
      "html": "<p>偵脈科技入選 115 年度第 2 梯次「創新創業激勵計畫（FITI）」，獲得創業發展與市場潛力的進一步肯定。透過本次計畫，團隊將持續聚焦產品定位、商業模式與市場策略，推進智慧型周邊循環監測技術從研發成果走向實際市場應用。</p>"
    },
    {
      "type": "text",
      "html": "<p>偵脈科技以周邊動脈疾病（Peripheral Artery Disease, PAD）的早期篩檢與長期監測需求為核心，開發非壓脈帶式智慧型周邊循環監測系統，整合 PPG 與 ECG 訊號量測，降低傳統周邊循環檢測對專業操作人力與場域的限制，期望讓血管健康評估能進一步延伸至診所、健檢、長照及更多日常照護場域。</p>"
    },
    {
      "type": "text",
      "html": "<p>FITI 創新創業激勵計畫透過創業課程、業師輔導及階段性評選等機制，協助團隊從技術研發進一步梳理市場需求、產品價值與商業化策略。對偵脈科技而言，本次入選除了是對團隊技術與創業方向的肯定，也提供重新檢視市場定位與商業模式的機會，進一步強化產品與實際使用場域之間的連結。</p>"
    },
    {
      "type": "text",
      "html": "<p>未來，偵脈科技將持續結合臨床需求、市場回饋與產品驗證成果，完善產品與商業化布局，並透過創業與產業資源鏈結，逐步推動智慧型周邊循環監測技術進入更多醫療與健康照護應用場域。</p>"
    }
  ]
},
    "8": {

  "date": "2026 年 8 月 26 日",
  "blocks": [
    {

      "html": "<p>偵脈科技營運中心於2026年8月26日在台南經緯天廈16樓正式啟用，象徵公司從技術研發與新創籌備階段，進一步邁向產品化、組織營運與市場拓展的新階段。隨著營運據點正式啟動，團隊將以此作為產品開發、臨床驗證、法規規劃與商業發展的重要基地，持續推進智慧型周邊循環監測技術落實至實際應用場域。</p>"

    {
      "type": "text",

  const params = new URLSearchParams(window.location.search);

    if (!id) {
    // 如果沒有 id，就不渲染 detail
    return;
    }
  document.querySelectorAll('.lang-switch a').forEach(link => {
    const url = new URL(link.href);
    url.pathname = url.pathname.replace(/news(-en)?\.html$/, 'news-detail$1.html');
    url.searchParams.set('id', id);
    link.href = url.href;
  });
  const news = data[id];

  if (!news) {
    root.innerHTML = "<div class='container' style='padding:60px 0; text-align:center;'>找不到此篇新聞</div>";

  }

  // 外框（讓版面跟你 about 的 container 一致）
  root.innerHTML = `
    <div class="container news-detail-wrap" style="padding: 40px 0 10px;">
      <div class="row">
        <div class="col-lg-10 col-lg-offset-1">
          <h2 style="margin:0 0 8px; font-size:30px; line-height:1.25;">${news.title}</h2>
          <div style="opacity:.75; margin-bottom:18px;">${news.date}</div>
          <div id="newsBlocksInner"></div>
          <div style="margin-top:28px;">
            <a class="news-btn" href="news.html">← 回到最新消息</a>
          </div>
        </div>
      </div>
    </div>
  `;

  document.title = news.title + " | PECURA";
  const inner = document.getElementById("newsBlocksInner");

  function renderBlock(b) {
    if (b.type === "hero") {
    return `
        <figure style="margin:0 0 22px;">
        <img class="news-img news-img--rounded" src="${b.img}" alt="${b.caption || ''}">
        ${b.caption ? `<figcaption class="news-caption">${b.caption}</figcaption>` : ''}
        </figure>
    `;
    }

    if (b.type === "text") {
      return `
        <div style="margin: 0 0 18px; line-height:1.9; font-size:16px;">
          ${b.html}
        </div>`;
    }

    if (b.type === "gallery") {
    const cols = b.cols || 2;

    const imgs = (b.images || []).map(img =>
        `<figure class="news-gallery-item">
        <img class="news-gallery-img" 
                src="${img.src}" 
                alt="${img.caption || ''}">
        ${img.caption ? `<figcaption class="news-caption">${img.caption}</figcaption>` : ''}
        </figure>`
    ).join("");

    return `
        <div class="news-gallery cols-${cols}">
        ${imgs}
        </div>`;
    }

    if (b.type === "image-right") {
    return `
        <div style="display:grid; grid-template-columns:1.1fr .9fr; gap:18px; align-items:start; margin: 22px 0;">
        <div style="line-height:1.9; font-size:16px;">${b.html}</div>
        <figure>
            <img class="news-img news-img--rounded" src="${b.img}" alt="${b.caption || ''}">
            ${b.caption ? `<figcaption class="news-caption">${b.caption}</figcaption>` : ''}
        </figure>
        </div>
    `;
    }

    if (b.type === "quote") {
      return `
        <blockquote style="margin: 22px 0; padding: 16px 18px; background:#f5f7fa;
          border-left:4px solid #32b29e; border-radius:12px; font-size:16px;">
          ${b.text}
        </blockquote>`;
    }

    if (b.type === "links-marquee") {
    const items = (b.items || []);
    if (!items.length) return "";

    const track = items.map(it =>
        `<a class="news-marquee__item" href="${it.href}" target="_blank" rel="noopener">${it.text}</a>`
    ).join("");

    // ✅ 複製一份，做無縫循環
    return `
        <div class="news-marquee">
        <div class="news-marquee__label">媒體報導</div>
        <div class="news-marquee__viewport">
            <div class="news-marquee__track">
            ${track}
            ${track}
            </div>
        </div>
        </div>
    `;
    }

    return "";
  }

  (news.blocks || []).forEach(b => inner.insertAdjacentHTML("beforeend", renderBlock(b)));
})();
