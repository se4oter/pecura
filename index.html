<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PECURA</title>
  <style>
    /* 讓整頁置中排列 */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;          /* 垂直置中 */
      justify-content: center;      /* 水平置中 */
      background: #fff;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    /* 垂直堆疊：上圖下字 */
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 24px;
      width: 100%;
      box-sizing: border-box;
    }
    /* 圖片自適應：不超過螢幕寬/高 */
    .hero-img {
      display: block;
      max-width: min(92vw, 1200px);              /* 不超過視窗寬 */
      max-height: calc(100vh - 140px);           /* 扣掉上下內距與文字空間，避免超出視窗高 */
      width: auto;
      height: auto;
      object-fit: contain;                        /* 保持比例 */
    }
    .note {
      font-size: 1rem;
      letter-spacing: 0.05em;
      opacity: 0.75;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <!-- 換成你的圖片路徑 -->
    <img class="hero-img" src="https://se4oter.github.io/pecura/images/LOGO.jpg" alt="PECURA" />
    <div class="note">網站建置中</div>
    <div class="note">Contact: </div>
  </main>
</body>
</html>
