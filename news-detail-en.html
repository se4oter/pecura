    "3": {

    "5": {
  "title": "PECURA Selected Among the Top 10 Teams in the 2026 Qualcomm Innovate in Taiwan Challenge",
  "date": "Apr 24, 2026",
  "blocks": [
    {
      "type": "hero",
      "img": "assets/img/news/5/01-qualcomm-qitc.png",
      "caption": "PECURA Selected Among the Top 10 Teams in the 2026 Qualcomm Innovate in Taiwan Challenge"
    },
    {
      "type": "text",
      "html": "<p>PECURA Technology has been selected among the top 10 teams in the 2026 Qualcomm Innovate in Taiwan Challenge (QITC), advancing to the incubation stage. Led by Qualcomm Technologies, QITC identifies and supports Taiwanese startups with innovative technology and market potential, providing technical resources, professional mentoring and commercialization support to accelerate product development and market expansion.</p>"

      "type": "text",
      "html": "<p>PECURA entered the challenge with its smart real-time peripheral circulation monitoring system, addressing early screening and long-term monitoring needs for peripheral artery disease (PAD). Its cuffless measurement approach integrates PPG and ECG signals to reduce the staffing, workflow and setting constraints of conventional peripheral circulation testing, with the aim of extending vascular health monitoring to clinics, health screening, long-term care and everyday healthcare.</p>"
    },
    {
      "type": "text",
      "html": "<p>QITC 2026 evaluates technological innovation, practical value, market relevance, product design, time-to-market advantages and business potential. During incubation, selected teams receive technical support, professional training, business strategy guidance and intellectual property resources to refine their products and market direction.</p>"
    },
    {
      "type": "text",
      "html": "<p>Selection among the top 10 marks an important milestone in PECURA’s product development and commercialization. Through QITC resources and industry connections, the team will continue improving its technology and applications, strengthen deployment in real-world settings and explore further medical and health technology market opportunities.</p>"
    }
  ]

    "6": {
  "title": "PECURA Showcases at BIO Asia–Taiwan 2026, Connecting with Cardiovascular Clinics and Health Screening Providers",

  "blocks": [

      "type": "hero",

    {
      "type": "text",
      "html": "<p>During BIO Asia–Taiwan 2026, PECURA Technology exhibited alongside National Cheng Kung University, presenting its independently developed smart real-time peripheral circulation monitoring system and sharing innovative vascular health monitoring technology and product applications with medical and biotechnology professionals.</p>"

        }
      ]

    {
      "type": "text",
      "html": "<p>Cardiovascular clinics, health screening providers and other healthcare organizations visited to learn about measurement workflows, ease of operation and practical applications. Compared with conventional peripheral circulation testing equipment, PECURA combines cuffless measurement with PPG and ECG signals to simplify operation and make vascular health assessment more flexible across healthcare settings.</p>"

    },
    {
      "type": "text",
      "html": "<p>The exhibition increased PECURA’s visibility in the medical and biotechnology sectors and strengthened connections with potential healthcare providers, health screening organizations and industry partners. PECURA will continue engaging through exhibitions, clinical discussions and industry collaboration to expand real-world applications in cardiovascular health and preventive medicine.</p>"
    }
  ]
},
    "7": {
  "title": "PECURA Selected for the 2026 Second Cohort of FITI, Advancing Commercialization and Market Development",
  "date": "Jul 22, 2026",
  "blocks": [
    {
      "type": "hero",
      "img": "assets/img/news/7/01-fiti.png",
      "caption": "PECURA Selected for the 2026 Second Cohort of FITI, Advancing Commercialization and Market Development"
    },
    {
      "type": "text",
      "html": "<p>PECURA Technology has been selected for the second cohort of the 2026 From IP to IPO (FITI) program, receiving further recognition of its entrepreneurial development and market potential. Through the program, the team will focus on product positioning, business models and market strategy to bring smart peripheral circulation monitoring from research into practical market applications.</p>"
    },
    {
      "type": "text",
      "html": "<p>Addressing early screening and long-term monitoring needs for peripheral artery disease (PAD), PECURA is developing a cuffless smart peripheral circulation monitoring system that integrates PPG and ECG measurements. The approach aims to reduce the specialist staffing and setting constraints of conventional testing and extend vascular health assessment to clinics, health screening, long-term care and everyday care settings.</p>"
    },
    {
      "type": "text",
      "html": "<p>Through entrepreneurship courses, industry mentoring and staged evaluations, FITI helps teams clarify market needs, product value and commercialization strategy. For PECURA, selection recognizes its technology and entrepreneurial direction while offering an opportunity to reassess market positioning and its business model, strengthening the connection between its product and real-world use.</p>"
    },
    {
      "type": "text",
      "html": "<p>PECURA will continue combining clinical needs, market feedback and product validation to refine its product and commercialization plans. Through entrepreneurial and industry connections, the team aims to bring smart peripheral circulation monitoring to more medical and healthcare applications.</p>"
    }
  ]
},
    "8": {
  "title": "PECURA Opens Its Operations Center, Marking a Milestone with Academic and Industry Partners",
  "date": "Aug 26, 2026",
  "blocks": [
    {
      "type": "text",
      "html": "<p>PECURA Technology officially opened its operations center on the 16th floor of the Jingwei Tianxia building in Tainan on August 26, 2026. The opening marks a transition from technology research and startup preparation toward product development, organizational operations and market expansion. The center will serve as a base for product development, clinical validation, regulatory planning and business development, supporting real-world applications of smart peripheral circulation monitoring.</p>"
    },
    {
      "type": "text",
      "html": "<p>An unveiling ceremony brought together a shareholder representative, the chief operating officer of Quan Hao Industrial, the director of NCKU’s industry-academia innovation center, the NCKU startup accelerator team, industry partners and friends. The event reinforced support and exchange across academia, industry and the startup ecosystem, building a stronger foundation for product progress and market development.</p>"
    },
    {
      "type": "text",
      "html": "<p>PECURA focuses on developing a smart real-time peripheral circulation monitoring system. Its cuffless measurement approach integrates PPG and ECG signals to reduce the staffing, testing workflow and setting constraints of conventional peripheral circulation assessment, making vascular health assessment more accessible in healthcare institutions, health screening, long-term care and other care settings.</p>"
    },
    {
      "type": "text",
      "html": "<p>With the operations center open, the team will integrate research, clinical, regulatory and market resources to improve product maturity and strengthen collaboration with healthcare institutions, industry partners and potential users. The center will support product validation, quality management, regulatory certification and market development as PECURA advances toward practical medical and healthcare applications.</p>"
    }
  ]
},

    {
      "type": "text",
      "html": "<p>Centered on smart healthcare connections, industry empowerment and real-world validation, the event explored how smart healthcare technology can respond to clinical needs, accelerate product and service innovation and reach practical deployment. Technology demonstrations, pitches and matchmaking brought together healthcare, industry, academic and startup teams to connect solutions with real-world settings.</p>"
    },
    {
      "type": "gallery",
      "cols": 2,
      "images": [
        {
          "src": "assets/img/news/9/02-healthcare-exchange.jpg",
          "caption": "Smart healthcare exchange — 2"
        },
        {
          "src": "assets/img/news/9/03-healthcare-exchange.jpg",
          "caption": "Smart healthcare exchange — 3"
        },
        {
          "src": "assets/img/news/9/04-healthcare-exchange.jpg",
          "caption": "Smart healthcare exchange — 4"
        }
      ]
    },
    {
      "type": "text",
      "html": "<p>PECURA presented its cuffless smart peripheral circulation monitoring technology, which integrates PPG and ECG signals to reduce the staffing, workflow and setting constraints of conventional testing. Beyond healthcare institutions, the team aims to expand into health screening, long-term care and other healthcare settings, providing more convenient vascular health assessment and long-term tracking.</p>"
    },
    {
      "type": "text",
      "html": "<p>Through discussions and matchmaking, the team explored practical needs, deployment and future collaboration with healthcare and industry partners, further validating product positioning and market demand. PECURA will continue strengthening these partnerships and combining clinical feedback, product validation and real-world evidence to advance practical applications and market deployment.</p>"
    }
  ]
}
  };

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

    if (!id) {
    // 如果沒有 id，就不渲染 detail
    return;
    }
  document.querySelectorAll('.lang-switch a').forEach(link => {
    const url = new URL(link.href);
    url.pathname = url.pathname.replace(/news(-en)?\.html$/, 'news-detail$1.html');
    url.searchParams.set('id', id);
    link.href = url.href;
  });
  const news = data[id];

  if (!news) {
    root.innerHTML = "<div class='container' style='padding:60px 0; text-align:center;'>News article not found.</div>";
    return;
  }

  // 外框（讓版面跟你 about 的 container 一致）
  root.innerHTML = `
    <div class="container news-detail-wrap" style="padding: 40px 0 10px;">
      <div class="row">
        <div class="col-lg-10 col-lg-offset-1">
          <h2 style="margin:0 0 8px; font-size:30px; line-height:1.25;">${news.title}</h2>
          <div style="opacity:.75; margin-bottom:18px;">${news.date}</div>
          <div id="newsBlocksInner"></div>
          <div style="margin-top:28px;">
            <a class="news-btn" href="news-en.html">← Back to News</a>
          </div>
        </div>
      </div>
    </div>
  `;

  document.title = news.title + " | PECURA";
  const inner = document.getElementById("newsBlocksInner");

  function renderBlock(b) {
    if (b.type === "hero") {
    return `
        <figure style="margin:0 0 22px;">
        <img class="news-img news-img--rounded" src="${b.img}" alt="${b.caption || ''}">
        ${b.caption ? `<figcaption class="news-caption">${b.caption}</figcaption>` : ''}
        </figure>
    `;
    }

    if (b.type === "text") {
      return `
        <div style="margin: 0 0 18px; line-height:1.9; font-size:16px;">
          ${b.html}
        </div>`;
    }

    if (b.type === "gallery") {
    const cols = b.cols || 2;

    const imgs = (b.images || []).map(img =>
        `<figure class="news-gallery-item">
        <img class="news-gallery-img" 
                src="${img.src}" 
                alt="${img.caption || ''}">
        ${img.caption ? `<figcaption class="news-caption">${img.caption}</figcaption>` : ''}
        </figure>`
    ).join("");

    return `
        <div class="news-gallery cols-${cols}">
        ${imgs}
        </div>`;
    }

    if (b.type === "image-right") {
    return `
        <div style="display:grid; grid-template-columns:1.1fr .9fr; gap:18px; align-items:start; margin: 22px 0;">
        <div style="line-height:1.9; font-size:16px;">${b.html}</div>
        <figure>
            <img class="news-img news-img--rounded" src="${b.img}" alt="${b.caption || ''}">
            ${b.caption ? `<figcaption class="news-caption">${b.caption}</figcaption>` : ''}
        </figure>
        </div>
    `;
    }

    if (b.type === "quote") {
      return `
        <blockquote style="margin: 22px 0; padding: 16px 18px; background:#f5f7fa;
          border-left:4px solid #32b29e; border-radius:12px; font-size:16px;">
          ${b.text}
        </blockquote>`;
    }

    if (b.type === "links-marquee") {
    const items = (b.items || []);
    if (!items.length) return "";

    const track = items.map(it =>
        `<a class="news-marquee__item" href="${it.href}" target="_blank" rel="noopener">${it.text}</a>`
    ).join("");

    // ✅ 複製一份，做無縫循環
    return `
        <div class="news-marquee">
        <div class="news-marquee__label">Media Coverage</div>
        <div class="news-marquee__viewport">
            <div class="news-marquee__track">
            ${track}
            ${track}
            </div>
        </div>
        </div>
    `;
    }

    return "";
  }

  (news.blocks || []).forEach(b => inner.insertAdjacentHTML("beforeend", renderBlock(b)));
})();
</script>
